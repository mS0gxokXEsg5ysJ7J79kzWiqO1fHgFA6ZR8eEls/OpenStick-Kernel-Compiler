name: Build OpenStick Kernel
run-name: Build OpenStick Kernel ${{ inputs.kernel_version }} (CPR:${{ inputs.enable_cpr }} XFRM:${{ inputs.enable_xfrm }} #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核分支 (例如 msm8916/6.12.1)'
        required: true
        default: 'msm8916/6.12.1'
      enable_cpr:
        description: '是否启用 CPR 补丁'
        required: true
        type: boolean
        default: true
      enable_xfrm:
        description: '是否启用 XFRM/IPsec 支持'
        required: true
        type: boolean
        default: true
      clean_build:
        description: '是否强制清理缓存从零编译'
        required: false
        type: boolean
        default: false
      publish_prerelease:
        description: '是否推送到预览版 (Pre-release)'
        required: true
        type: boolean
        default: true
      publish_release:
        description: '是否推送到发行版 (Release)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git curl python3 python3-venv

      - name: Cache kernel build & tools
        uses: actions/cache@v4
        with:
          path: |
            pmos-venv
            pmbootstrap
            pmos-work/cache_git
            pmos-work/cache_apk_aarch64
            pmos-work/cache_apk_x86_64
            linux-msm8916
          key: kernel-${{ inputs.kernel_version }}-cpr-${{ inputs.enable_cpr }}-xfrm-${{ inputs.enable_xfrm }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            kernel-${{ inputs.kernel_version }}-cpr-${{ inputs.enable_cpr }}-xfrm-${{ inputs.enable_xfrm }}-

      - name: Run build script (non-interactive)
        run: |
          chmod +x ./build.sh
          CPR_FLAG="--no-cpr"
          XFRM_FLAG="--no-xfrm"
          CLEAN_FLAG=""
          if [ "${{ inputs.enable_cpr }}" = "true" ]; then CPR_FLAG="--cpr"; fi
          if [ "${{ inputs.enable_xfrm }}" = "true" ]; then XFRM_FLAG="--xfrm"; fi
          if [ "${{ inputs.clean_build }}" = "true" ]; then CLEAN_FLAG="--clean"; fi
          ./build.sh --auto $CLEAN_FLAG --version "${{ inputs.kernel_version }}" $CPR_FLAG $XFRM_FLAG
          ls -lh builds/*.apk

      - name: Sanitize artifact name
        id: safe_name
        run: |
          SAFE="${{ inputs.kernel_version }}"
          SAFE="${SAFE//\//-}"
          echo "value=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstick-kernel-${{ steps.safe_name.outputs.value }}
          path: builds/*.apk
          if-no-files-found: error

      - name: Publish Pre-release
        if: ${{ inputs.publish_prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.safe_name.outputs.value }}-${{ github.run_number }}
          name: Pre-release ${{ inputs.kernel_version }} (#${{ github.run_number }})
          prerelease: true
          files: builds/*.apk

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.safe_name.outputs.value }}-${{ github.run_number }}
          name: Release ${{ inputs.kernel_version }} (#${{ github.run_number }})
          prerelease: false
          files: builds/*.apk
