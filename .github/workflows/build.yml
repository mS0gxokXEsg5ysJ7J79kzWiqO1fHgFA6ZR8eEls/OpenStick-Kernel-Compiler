name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核分支 (例如 msm8916/6.12.1)'
        required: true
        default: 'msm8916/6.12.1'
      enable_cpr:
        description: '是否启用 CPR 补丁'
        required: true
        type: boolean
        default: false
      publish_prerelease:
        description: '是否推送到预览版 (Pre-release)'
        required: false
        type: boolean
        default: false
      publish_release:
        description: '是否推送到发行版 (Release)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git curl python3 python3-venv

      - name: Run build script (non-interactive)
        run: |
          chmod +x ./build.sh
          CPR_FLAG="--no-cpr"
          if [ "${{ inputs.enable_cpr }}" = "true" ]; then CPR_FLAG="--cpr"; fi
          ./build.sh --auto --clean --version "${{ inputs.kernel_version }}" $CPR_FLAG
          ls -lh builds/*.apk

      - name: Sanitize artifact name
        id: safe_name
        run: |
          SAFE="${{ inputs.kernel_version }}"
          SAFE="${SAFE//\//-}"
          echo "value=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstick-kernel-${{ steps.safe_name.outputs.value }}
          path: builds/*.apk
          if-no-files-found: error

      - name: Publish Pre-release
        if: ${{ inputs.publish_prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.safe_name.outputs.value }}-${{ github.run_number }}
          name: Pre-release ${{ inputs.kernel_version }} (#${{ github.run_number }})
          prerelease: true
          files: builds/*.apk

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.safe_name.outputs.value }}-${{ github.run_number }}
          name: Release ${{ inputs.kernel_version }} (#${{ github.run_number }})
          prerelease: false
          files: builds/*.apk
