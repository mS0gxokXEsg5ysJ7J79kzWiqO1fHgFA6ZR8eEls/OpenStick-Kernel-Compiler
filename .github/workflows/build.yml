name: Build OpenStick Kernel
run-name: "Build OpenStick Kernel #${{ github.run_number }} (CPR:${{ inputs.enable_cpr }} XFRM:${{ inputs.enable_xfrm }})"

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核分支 (例如 msm8916/6.12.1)'
        required: true
        default: 'msm8916/6.12.1'
      enable_cpr:
        description: '是否启用 CPR 补丁'
        required: true
        type: boolean
        default: true
      enable_xfrm:
        description: '是否启用 XFRM/IPsec 支持'
        required: true
        type: boolean
        default: true
      clean_build:
        description: '是否强制清理缓存从零编译'
        required: false
        type: boolean
        default: false
      publish_prerelease:
        description: '是否推送到预览版 (Pre-Release)'
        required: true
        type: boolean
        default: true
      publish_release:
        description: '是否推送到发行版 (Release)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash git curl python3 python3-venv

      - name: Cache kernel build & tools
        uses: actions/cache@v4
        with:
          path: |
            pmos-venv
            pmbootstrap
            pmos-work/cache_git
            pmos-work/cache_apk_aarch64
            pmos-work/cache_apk_x86_64
            linux-msm8916
          key: kernel-${{ inputs.kernel_version }}-cpr-${{ inputs.enable_cpr }}-xfrm-${{ inputs.enable_xfrm }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            kernel-${{ inputs.kernel_version }}-cpr-${{ inputs.enable_cpr }}-xfrm-${{ inputs.enable_xfrm }}-

      - name: Run build script (non-interactive)
        run: |
          chmod +x ./build.sh
          CPR_FLAG="--no-cpr"
          XFRM_FLAG="--no-xfrm"
          CLEAN_FLAG=""
          if [ "${{ inputs.enable_cpr }}" = "true" ]; then CPR_FLAG="--cpr"; fi
          if [ "${{ inputs.enable_xfrm }}" = "true" ]; then XFRM_FLAG="--xfrm"; fi
          if [ "${{ inputs.clean_build }}" = "true" ]; then CLEAN_FLAG="--clean"; fi
          ./build.sh --auto $CLEAN_FLAG --version "${{ inputs.kernel_version }}" $CPR_FLAG $XFRM_FLAG
          ls -lh builds/*.apk

      - name: Sanitize artifact name
        id: safe_name
        run: |
          SAFE="${{ inputs.kernel_version }}"
          SAFE="${SAFE//\//-}"
          KVER=$(echo "${{ inputs.kernel_version }}" | sed 's|.*/||; s|^v||')
          TAG_TIME=$(TZ='Asia/Shanghai' date +'%y%m%d-%H%M%S')
          TITLE_TIME=$(TZ='Asia/Shanghai' date +'%y-%m-%d %H:%M:%S')

          # 动态拼接功能后缀（不勾选则不显示）
          EXTRA=""
          if [ "${{ inputs.enable_cpr }}" = "true" ]; then EXTRA="${EXTRA}-cpr"; fi
          if [ "${{ inputs.enable_xfrm }}" = "true" ]; then EXTRA="${EXTRA}-xfrm"; fi

          # ✅ 最终输出文件名
          FINAL_APK="linux-postmarketos-qcom-msm8916-${KVER}${EXTRA}.apk"

          SRC_APK=$(ls builds/*.apk | head -n 1)
          if [ -f "$SRC_APK" ] && [ "$(basename "$SRC_APK")" != "$FINAL_APK" ]; then
            mv -f "$SRC_APK" "builds/$FINAL_APK"
          fi
          ls -lh builds/*.apk

          echo "value=$SAFE" >> "$GITHUB_OUTPUT"
          echo "kver=$KVER" >> "$GITHUB_OUTPUT"
          echo "tag_time=$TAG_TIME" >> "$GITHUB_OUTPUT"
          echo "title_time=$TITLE_TIME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # 【Artifact 文件名】Actions 页面下载的压缩包名称
          name: openstick-kernel-${{ steps.safe_name.outputs.value }}
          # 【实际 APK 文件名】由 build.sh 生成（如 linux-postmarketos-qcom-msm8916-6.12.1-cpr-xfrm.apk）
          path: builds/*.apk
          if-no-files-found: error

      - name: Publish Pre-release
        if: ${{ inputs.publish_prerelease }}
        uses: softprops/action-gh-release@v2
        with:
          # 【Tag 标签】预览版 Git Tag（禁止空格与冒号）
          tag_name: "OpenStick-Kernel-msm8916-${{ steps.safe_name.outputs.kver }}-p${{ github.run_number }}"
          # 【页面标题】预览版 Release 顶部显示的大标题
          name: "OpenStick Kernel msm8916 ${{ steps.safe_name.outputs.kver }} Pre-release: ${{ github.run_number }} (${{ steps.safe_name.outputs.title_time }})"
          prerelease: true
          # 【附件文件名】上传到 Release 页面的 .apk 文件（文件名由上面的 FINAL_APK 决定）
          files: builds/*.apk

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          # 【Tag 标签】正式版 Git Tag（禁止空格与冒号）
          tag_name: "OpenStick-Kernel-msm8916-${{ steps.safe_name.outputs.kver }}-r${{ github.run_number }}"
          # 【页面标题】正式版 Release 顶部显示的大标题（已顺手将误写的 Pre-release 改为 Release）
          name: "OpenStick Kernel msm8916 ${{ steps.safe_name.outputs.kver }} Release: ${{ github.run_number }} (${{ steps.safe_name.outputs.title_time }})"
          prerelease: false
          # 【附件文件名】上传到 Release 页面的 .apk 文件（文件名由上面的 FINAL_APK 决定）
          files: builds/*.apk
